<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            border: solid 3px purple;
            width: 330px;
            height: 450px;
        }
        #absolute{
            background-color: red;
            border: solid 2px red;
            width: 200px;
            height: 200px;
            top: 100px;
            left: 100px;
            position: absolute;
            color: white;
        }
    </style>
</head>
<body>
    <div class="parent">
    <p>This is a parent container!</p>
    <div id="absolute">
        <p>This is an absolutely positioned child div.</p>
    </div>
</div>
</body>
</html>
