<!DOCTYPE html>
<html>
  <head>
    <style>
      nav ul {
        list-style: none;
        padding: 0;
      }

      nav li {
        display: inline;
        margin-right: 20px;
      }
      .dropdown-menu {
        display: none;
        
        background-color: #fff;
        border: 1px solid #ccc;
        padding: 10px;
      }

      .dropdown:hover .dropdown-menu {
        display: block;
        position: absolute;
        top: 50px;
        left: 70px;

      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li class="dropdown">
          <a href="#">Services</a>
          <ul class="dropdown-menu">
            <li><a href="#">Web Design</a></li><br><br>
            <li><a href="#">Graphic Design</a></li><br><br>
            <li><a href="#">SEO</a></li><br><br>
          </ul>
        </li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </body>
</html>
