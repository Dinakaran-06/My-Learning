<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a[target="_blank"]{
            color: red;
        }
        a[target="_self"]{
            color: blue;
        }
    </style>
</head>
<body>
    <a href="https:/youtube.com" target="_blank">External Link 1</a><br>
    <a href="https:/amazon.in" target="_self">Internal Link</a><br>
    <a href="www.google.com" target="_blank">External Link 2</a><br>
</body>
</html>
