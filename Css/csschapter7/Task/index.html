<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .check:checked{
            accent-color: red;
            height: 30px;
            width: 25px;
        }
    </style>
</head>
<body>
    <h1>My Hobbies:</h1>
    <input type="checkbox" name="Coding" class="check" checked  id="My Hobbies" value="Coding">
    <label for="Coding">Coding</label><br>
    <input type="checkbox" name="Reading Books" class="check"   id="My Hobbies" value="Reading Books">
    <label for="Reading Books">Reading Books</label><br>
    <input type="checkbox" name="Playing Indoor Games" class="check"  id="My Hobbies" value="Playing Indoor Games">
    <label for="Playing Indoor Games">Playing Indoor Games</label>

</body>
</html>
