<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .p1,.p2,.p4{
        background-color: yellow;
        font-style: italic;
    }
    .p3{
        font-style: italic;
    }
    div .p5,.p6{
        color: blue;
    }
    .p5{
        background-color: purple;
    }
</style>
    
</head>
<body>
    <h2>Child selector</h2>
    <div class="Container">
        <p>The child selector(>) selects all elements that are the children of a specified elements</p>
        <p class="p1">Paragraph 1 in the div.</p>
        <p class="p2">Paragraph 2 in the div.</p>
        <p class="p3">Paragraph 3 in the div (inside a section element).</p>
        <p class="p4">Paragraph 4 in the div.</p>
        <p class="p5">Paragraph 5. Not in a div.</p>
        <p class="p6">Paragraph 6. Not in a div.</p>
    </div>    
</body>
</html>
