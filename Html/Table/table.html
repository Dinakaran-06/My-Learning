<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
</head>
<body>
    <table border="2px">
        <caption>University Marks</caption>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>M1</td>
                <td rowspan="2">40</td>
            </tr>
            <tr>
                <td>2</td>
                <td>M2</td>   
            </tr>
            <tr>
                <td>3</td>
                <td>M3</td>
                <td>42</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>137</td>
            </tr>
        </tfoot>
    </table>   
</body>
</html>
