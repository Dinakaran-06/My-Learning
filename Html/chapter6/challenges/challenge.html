<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking Form</title>
</head>
<body>
    <h1>Tour Booking Form</h1>
    <h3>Note: * Mandatory Fields</h3><hr>
    <form action="www.travels.com" name="" method="post">
        <label for="name">Full name*:</label><br>
        <input type="text" id="name" name="name"><br><br>
        <label for="Email">Email address*:</label><br>
        <input type="text" id="name" name="name"><br><br>
        <label for="text">Select Tour Package*:</label><br>
        <select name="Select Tour Package">
            <option value="South India">South India</option>
            <option value="North India">North India</option>
            <option value="India">India</option>
        </select><br><br>
        <label for="date">Arrival date*:</label><br>
        <input type="date" id="name" name="Arrival date"><br><br>
        <label for="name">Number of persons*:</label><br>
        <input type="number" id="name" name="name"><br><br>
        <label for="name">What would you want to avail*?</label><br>
        <input type="checkbox" id="Boarding" name="What would you want to avail" value="Boarding">
        <label for="Boarding">Boarding</label><br>
        <input type="checkbox" id="Food" name="What would you want to avail" value="Food">
        <label for="Food">Food</label><br>
        <input type="checkbox" id="Sight seeing" name="What would you want to avail" value="Sight seeing">
        <label for="Sight seeing">Sight seeing</label><br><br>
        <label for="name">Terms and Conditions*</label><br>
        <input type="radio" id="I agree" name="Terms and Conditions" value="I agree">
        <label for="I agree">I agree</label>
        <input type="radio" id="I disagree" name="Terms and Conditions" value="I disagree">
        <label for="I disagree">I disagree</label><br><br>
        <input type="submit" value="BOOK NOW">
    </form>   
</body>
</html>
